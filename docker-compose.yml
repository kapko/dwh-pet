version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY:-}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__SECRET_KEY=${WEBSERVER_SECRET_KEY:-your-secret-key}
    # DWH connection
    - DWH_HOST=dwh-postgres
    - DWH_PORT=5432
    - DWH_USER=dwh
    - DWH_PASSWORD=dwh
    - DWH_DB=dwh
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
    dwh-postgres:
      condition: service_healthy

services:
  # PostgreSQL for Airflow metadata
  airflow-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  # PostgreSQL for DWH (your data warehouse)
  dwh-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=dwh
      - POSTGRES_PASSWORD=dwh
      - POSTGRES_DB=dwh
    volumes:
      - dwh_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Airflow Init
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: "no"

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # dbt for data transformations
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.4
    environment:
      - DWH_HOST=dwh-postgres
      - DWH_PORT=5432
      - DWH_USER=dwh
      - DWH_PASSWORD=dwh
      - DWH_DB=dwh
    volumes:
      - ./dbt:/usr/app
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml
    working_dir: /usr/app/weather_dwh
    depends_on:
      dwh-postgres:
        condition: service_healthy
    profiles:
      - dbt

  # Metabase for BI dashboards
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=dwh
      - MB_DB_PASS=dwh
      - MB_DB_HOST=dwh-postgres
    depends_on:
      dwh-postgres:
        condition: service_healthy
    restart: always

volumes:
  airflow_postgres_data:
  dwh_postgres_data:
